<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rahino — کاراکتر زنده</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #14151a; color: #eee; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 12px; right: 12px; width: 260px; padding: 14px;
    background: rgba(24,25,32,.92); border: 1px solid #333; border-radius: 12px;
    display: flex; flex-direction: column; gap: 10px; z-index: 10;
  }
  #panel h1 { font-size: 15px; }
  #status { font-size: 12px; color: #9aa; min-height: 16px; }
  #clips, #gestures { display: flex; flex-wrap: wrap; gap: 6px; }
  #gestures { border-top: 1px solid #333; padding-top: 10px; }
  #gestures button.hold { background: #7a4ff7; border-color: #7a4ff7; }
  button {
    background: #2b2d3a; color: #eee; border: 1px solid #444; border-radius: 8px;
    padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #3a3d50; }
  button.active { background: #4f6ef7; border-color: #4f6ef7; }
  label.file {
    display: block; text-align: center; background: #2b2d3a; border: 1px dashed #555;
    border-radius: 8px; padding: 8px; font-size: 13px; cursor: pointer;
  }
  input[type=file] { display: none; }
  #talkMeter { height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
  #talkMeter i { display: block; height: 100%; width: 0; background: #4f6ef7; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="panel">
  <h1>🦏 Rahino — کاراکتر زنده</h1>
  <div id="status">در حال بارگذاری مدل…</div>
  <div id="clips"></div>
  <div id="gestures"></div>
  <label class="file">🎵 فایل صدا برای لیپ‌سینک
    <input id="audioFile" type="file" accept="audio/*">
  </label>
  <button id="micBtn">🎤 لیپ‌سینک با میکروفون</button>
  <div id="talkMeter"><i></i></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const statusEl = document.getElementById('status');
const clipsEl = document.getElementById('clips');
const meterEl = document.querySelector('#talkMeter i');

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('scene').appendChild(renderer.domElement);

const sceneGraph = new THREE.Scene();
sceneGraph.background = new THREE.Color(0x14151a);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.7, 1.2, 1.5); // three-quarter front view (model faces +X)
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);

sceneGraph.add(new THREE.HemisphereLight(0xffffff, 0x404060, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 6, 4);
sceneGraph.add(sun);
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(3, 48),
  new THREE.MeshStandardMaterial({ color: 0x1e2028, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
sceneGraph.add(ground);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- character & animations ----------
const loader = new GLTFLoader();
let mixer = null, model = null, activeAction = null;
const actions = new Map();
let jawBone = null, headBone = null;
const mouthMorphs = []; // { mesh, index }

function registerClips(clips, prefix = '') {
  for (const clip of clips) {
    const name = prefix || clip.name || `clip${actions.size}`;
    if (actions.has(name)) continue;
    const action = mixer.clipAction(clip, model);
    actions.set(name, action);
    const btn = document.createElement('button');
    btn.textContent = name.replace(/^preset:/, '');
    btn.onclick = () => play(name, btn);
    clipsEl.appendChild(btn);
  }
}

function play(name, btn) {
  const next = actions.get(name);
  if (!next) return;
  if (activeAction && activeAction !== next) {
    next.reset().play();
    activeAction.crossFadeTo(next, 0.35, true);
  } else {
    next.reset().play();
  }
  activeAction = next;
  clipsEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
}

const bones = {};

function findFaceRig(root) {
  root.traverse(obj => {
    if (obj.isBone) {
      bones[obj.name] = obj;
      const n = obj.name.toLowerCase();
      if (!jawBone && /jaw|mouth|chin/.test(n)) jawBone = obj;
      if (!headBone && /^head/.test(n)) headBone = obj;
    }
    if (obj.isMesh && obj.morphTargetDictionary) {
      for (const [key, idx] of Object.entries(obj.morphTargetDictionary)) {
        if (/mouth|jaw|aa|open|viseme/i.test(key)) mouthMorphs.push({ mesh: obj, index: idx });
      }
    }
  });
}

// ---------- procedural puppet (no pre-made animations) ----------
// A gesture is a set of bone-rotation tracks applied ON TOP of whatever
// animation is playing, every frame after the mixer updates.
//   one-shot: value = amp * sin(pi*t/dur)                 (go and come back)
//   cycles>0: value = amp * sin(2pi*cycles*t/dur) * fade  (oscillate, fade out)
//   hold:     value eases to amp and stays until toggled off
// axes are WORLD axes; the character faces +X in rest pose, so:
//   z: pitch (nod/bow, negative = forward), y: yaw (turn, positive = its left),
//   x: lateral arm lift (negative lifts the right arm outward)
const GESTURES = {
  'سر تکان بده':   { tracks: [{ bone: 'Head', axis: 'z', amp: -0.4, cycles: 2 }], dur: 1.6 },
  'نه با سر':      { tracks: [{ bone: 'Head', axis: 'y', amp: 0.5, cycles: 2 }], dur: 1.6 },
  'بای‌بای':       { dur: 2.8, tracks: [
                      { bone: 'R_Clavicle', axis: 'x', amp: -0.35 },
                      { bone: 'R_Upperarm', axis: 'x', amp: -2.0 },
                      { bone: 'R_Forearm',  axis: 'x', amp: -0.45, cycles: 4 }] },
  'تعظیم':         { dur: 2.4, tracks: [
                      { bone: 'Spine01', axis: 'z', amp: 0.4 },
                      { bone: 'Spine02', axis: 'z', amp: 0.25 },
                      { bone: 'Head',    axis: 'z', amp: 0.15 }] },
  'دست راست بالا': { hold: true, tracks: [
                      { bone: 'R_Clavicle', axis: 'x', amp: -0.35 },
                      { bone: 'R_Upperarm', axis: 'x', amp: -2.1 }] },
  'دست چپ بالا':   { hold: true, tracks: [
                      { bone: 'L_Clavicle', axis: 'x', amp: 0.35 },
                      { bone: 'L_Upperarm', axis: 'x', amp: 2.1 }] },
  'نگاه به چپ':    { hold: true, tracks: [{ bone: 'Head', axis: 'y', amp: 0.6 }] },
  'نگاه به راست':  { hold: true, tracks: [{ bone: 'Head', axis: 'y', amp: -0.6 }] },
};

const activeGestures = new Map(); // name -> { t } or { level, on } for holds
const AXES = { x: new THREE.Vector3(1,0,0), y: new THREE.Vector3(0,1,0), z: new THREE.Vector3(0,0,1) };
const _q = new THREE.Quaternion(), _qw = new THREE.Quaternion(), _axis = new THREE.Vector3();

function doGesture(name) {
  const g = GESTURES[name];
  if (!g) return console.warn('unknown gesture', name);
  if (g.hold) {
    const cur = activeGestures.get(name);
    if (cur) cur.on = !cur.on;
    else activeGestures.set(name, { level: 0, on: true });
  } else {
    activeGestures.set(name, { t: 0 });
  }
  const btn = gestureButtons.get(name);
  if (btn && g.hold) btn.classList.toggle('hold', activeGestures.get(name).on);
}

function updatePuppet(dt) {
  for (const [name, s] of activeGestures) {
    const g = GESTURES[name];
    let env; // 0..1 envelope for this frame
    if (g.hold) {
      s.level += ((s.on ? 1 : 0) - s.level) * Math.min(1, dt * 6);
      env = s.level;
      if (!s.on && env < 0.005) { activeGestures.delete(name); continue; }
    } else {
      s.t += dt;
      if (s.t >= g.dur) { activeGestures.delete(name); continue; }
      env = Math.sin(Math.PI * s.t / g.dur);
    }
    for (const tr of g.tracks) {
      const bone = bones[tr.bone];
      if (!bone) continue;
      let v = tr.amp * env;
      if (tr.cycles) v = tr.amp * Math.sin(2 * Math.PI * tr.cycles * (s.t ?? 0) / g.dur) * env;
      // convert the world axis into this bone's local frame, then rotate
      bone.getWorldQuaternion(_qw).invert();
      _axis.copy(AXES[tr.axis]).applyQuaternion(_qw).normalize();
      _q.setFromAxisAngle(_axis, v);
      bone.quaternion.multiply(_q);
    }
  }
}

const gestureButtons = new Map();
const gesturesEl = document.getElementById('gestures');
for (const name of Object.keys(GESTURES)) {
  if (name.startsWith('_')) continue; // hidden (auto) gestures get no button
  const btn = document.createElement('button');
  btn.textContent = name;
  btn.onclick = () => doGesture(name);
  gestureButtons.set(name, btn);
  gesturesEl.appendChild(btn);
}

// ---------- runtime facial morphs ----------
// The Tripo mesh ships without blendshapes, so we build two morph targets
// from the geometry itself: mouth-open (lower lip/chin drops) and blink
// (eye regions squash shut). Region centres were calibrated for the
// rahino2 model; they sit in bind-pose model space.
const MORPH = { mouth: -1, blink: -1, mesh: null };

function buildFacialMorphs(mesh) {
  const g = mesh.geometry;
  const pos = g.attributes.position;
  const uv = g.attributes.uv;
  const n = pos.count;
  const mouthD = new Float32Array(n * 3);
  const blinkD = new Float32Array(n * 3);

  // Locate the face by texture colour: the irises are the only dark-blue
  // texels on the head, the mouth interior the only red-brown ones.
  const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
  const img = mat.map && mat.map.image;
  if (!img || !uv) { console.warn('no texture/uv; facial morphs skipped'); return; }
  const cv = document.createElement('canvas');
  cv.width = img.width; cv.height = img.height;
  const c2 = cv.getContext('2d', { willReadFrequently: true });
  c2.drawImage(img, 0, 0);
  const px = c2.getImageData(0, 0, cv.width, cv.height).data;

  const eyeIdx = [], mouthIdx = [];
  for (let i = 0; i < n; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    if (x < 0.05 || y < 0.55) continue; // head front only
    const tu = Math.min(cv.width - 1, Math.max(0, Math.round(uv.getX(i) * (cv.width - 1))));
    const tv = Math.min(cv.height - 1, Math.max(0, Math.round(uv.getY(i) * (cv.height - 1))));
    const k = (tv * cv.width + tu) * 4;
    const r = px[k], gr = px[k + 1], b = px[k + 2];
    if (y > 0.72 && b > 60 && b > r * 1.2 && b > gr * 1.2) eyeIdx.push(i);           // iris blue
    else if (y > 0.6 && y < 0.78 && r > 80 && r > gr * 1.45 && r > b * 1.45) mouthIdx.push(i); // mouth interior
  }

  const centroid = idx => {
    const c = [0, 0, 0];
    for (const i of idx) { c[0] += pos.getX(i); c[1] += pos.getY(i); c[2] += pos.getZ(i); }
    return c.map(v => v / (idx.length || 1));
  };

  // split iris vertices into the two eyes by z against their overall midline
  const allEyesC = centroid(eyeIdx);
  const eyeL = eyeIdx.filter(i => pos.getZ(i) >= allEyesC[2]);
  const eyeR = eyeIdx.filter(i => pos.getZ(i) < allEyesC[2]);
  const EYES = [eyeL, eyeR].filter(a => a.length > 10).map(idx => {
    const c = centroid(idx);
    let r2 = 0;
    for (const i of idx) {
      const dx = pos.getX(i) - c[0], dy = pos.getY(i) - c[1], dz = pos.getZ(i) - c[2];
      r2 = Math.max(r2, dx * dx + dy * dy + dz * dz);
    }
    const r = Math.min(0.09, Math.max(0.045, Math.sqrt(r2) * 1.45)); // iris -> whole eye
    return { x: c[0], y: c[1], z: c[2], r };
  });

  const mc = centroid(mouthIdx);
  let lipY = 0, mrz = 0;
  for (const i of mouthIdx) {
    lipY = Math.max(lipY, pos.getY(i));
    mrz = Math.max(mrz, Math.abs(pos.getZ(i) - mc[2]));
  }
  const M = mouthIdx.length > 20
    ? { x: mc[0], y: mc[1], z: mc[2], rx: 0.11, ry: 0.09, rz: Math.min(0.13, Math.max(0.08, mrz * 1.7)), lipY: lipY + 0.005 }
    : null;
  console.log('face detect:', { eyes: EYES, mouth: M, eyeVerts: eyeIdx.length, mouthVerts: mouthIdx.length });

  for (let i = 0; i < n; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    if (M && x > 0.05 && y < M.lipY) { // jaw region under the upper lip
      const dx = (x - M.x) / M.rx, dy = (y - M.y) / M.ry, dz = (z - M.z) / M.rz;
      const d = dx * dx + dy * dy + dz * dz;
      if (d < 1) {
        const w = Math.pow(1 - d, 1.2);
        // hinge: the further below the lip line, the more it drops
        const hinge = Math.min(1, (M.lipY - y) / 0.07);
        mouthD[i * 3 + 1] = -0.06 * w * hinge;
        mouthD[i * 3] = -0.01 * w * hinge; // tuck slightly back
      }
    }
    for (const E of EYES) {
      const dx = (x - E.x) / (E.r * 1.1), dy = (y - E.y) / E.r, dz = (z - E.z) / (E.r * 1.1);
      const d = dx * dx + dy * dy + dz * dz;
      if (d < 1) {
        const w = Math.pow(1 - d, 0.8);
        const lidY = E.y - 0.012; // shut line sits just under the eye centre
        blinkD[i * 3 + 1] += (lidY - y) * 0.98 * w;
        blinkD[i * 3] += -0.006 * w; // sink in a touch so the "lid" reads closed
      }
    }
  }
  g.morphTargetsRelative = true;
  g.morphAttributes.position = [
    new THREE.Float32BufferAttribute(mouthD, 3),
    new THREE.Float32BufferAttribute(blinkD, 3),
  ];
  mesh.updateMorphTargets();
  MORPH.mouth = 0; MORPH.blink = 1; MORPH.mesh = mesh;
  for (const m of Array.isArray(mesh.material) ? mesh.material : [mesh.material]) m.needsUpdate = true;
}

function setMorph(idx, v) {
  if (MORPH.mesh && idx >= 0) MORPH.mesh.morphTargetInfluences[idx] = v;
}

// ---------- auto blink ----------
let blinkWait = 1.5 + Math.random() * 3, blinkPhase = -1, autoBlink = true;
function triggerBlink() { if (blinkPhase < 0) blinkPhase = 0; }
function updateBlink(dt) {
  if (blinkPhase < 0) {
    if (!autoBlink) return;
    blinkWait -= dt;
    if (blinkWait <= 0) blinkPhase = 0;
    return;
  }
  blinkPhase += dt;
  const closeT = 0.09, openT = 0.13;
  const v = blinkPhase < closeT ? blinkPhase / closeT
          : Math.max(0, 1 - (blinkPhase - closeT) / openT);
  setMorph(MORPH.blink, v);
  if (blinkPhase > closeT + openT) {
    blinkPhase = -1;
    blinkWait = 1.5 + Math.random() * 3.5;
  }
}

// ---------- talking body language ----------
// small hidden gestures fired randomly while the character is speaking
Object.assign(GESTURES, {
  '_talk_nod':   { dur: 1.1, tracks: [{ bone: 'Head', axis: 'z', amp: 0.12, cycles: 1 }] },
  '_talk_tilt':  { dur: 1.5, tracks: [{ bone: 'Head', axis: 'x', amp: 0.12, cycles: 1 }] },
  '_talk_handR': { dur: 1.6, tracks: [
                    { bone: 'R_Upperarm', axis: 'x', amp: -0.45 },
                    { bone: 'R_Forearm',  axis: 'z', amp: 0.5, cycles: 1 }] },
  '_talk_handL': { dur: 1.6, tracks: [
                    { bone: 'L_Upperarm', axis: 'x', amp: 0.45 },
                    { bone: 'L_Forearm',  axis: 'z', amp: 0.5, cycles: 1 }] },
  '_talk_both':  { dur: 1.4, tracks: [
                    { bone: 'R_Forearm', axis: 'z', amp: 0.45 },
                    { bone: 'L_Forearm', axis: 'z', amp: 0.45 }] },
});
const TALK_GESTURES = ['_talk_nod', '_talk_tilt', '_talk_handR', '_talk_handL', '_talk_both'];
let talkGestureWait = 1.2, autoTalkGestures = true;
function updateTalkGestures(dt, level) {
  if (!autoTalkGestures || level < 0.06) return;
  talkGestureWait -= dt;
  if (talkGestureWait <= 0) {
    doGesture(TALK_GESTURES[Math.floor(Math.random() * TALK_GESTURES.length)]);
    talkGestureWait = 1.4 + Math.random() * 2.2;
  }
}

// console / external API: rahino.do('بای‌بای'), rahino.face.mouth(0..1), rahino.face.blink()
window.rahino = {
  do: doGesture, list: () => Object.keys(GESTURES).filter(k => !k.startsWith('_')),
  gestures: GESTURES, bones, camera, controls,
  stopAnims: () => { // freeze in bind pose (for debugging/calibration)
    if (mixer) mixer.stopAllAction();
    activeGestures.clear();
    if (MORPH.mesh) MORPH.mesh.skeleton.pose();
  },
  face: {
    mouth: v => setMorph(MORPH.mouth, v),
    blink: triggerBlink,
    autoBlink: on => { autoBlink = on; },
    autoTalkGestures: on => { autoTalkGestures = on; },
  },
};

// face test buttons
{
  const blinkBtn = document.createElement('button');
  blinkBtn.textContent = 'پلک بزن';
  blinkBtn.onclick = triggerBlink;
  gesturesEl.appendChild(blinkBtn);
}

async function init() {
  // switch manifests with ?m=manifest_rahino1.json
  const manifestName = new URLSearchParams(location.search).get('m') || 'manifest.json';
  let manifest = { character: 'models/character.glb', animations: {} };
  try {
    manifest = await (await fetch('models/' + manifestName)).json();
  } catch { /* fall back to defaults */ }

  const gltf = await loader.loadAsync(manifest.character);
  model = gltf.scene;
  sceneGraph.add(model);
  mixer = new THREE.AnimationMixer(model);
  findFaceRig(model);
  model.traverse(o => { if (o.isSkinnedMesh && !MORPH.mesh) buildFacialMorphs(o); });
  registerClips(gltf.animations);

  for (const [name, url] of Object.entries(manifest.animations || {})) {
    try {
      const animGltf = await loader.loadAsync(url);
      registerClips(animGltf.animations, name);
    } catch (e) { console.warn('animation failed:', name, e); }
  }

  statusEl.textContent = actions.size
    ? `آماده — ${actions.size} انیمیشن` : 'آماده (مدل بدون انیمیشن)';
  const first = clipsEl.querySelector('button');
  if (first) first.click();
}
init().catch(err => { statusEl.textContent = 'خطا در بارگذاری مدل: ' + err.message; });

// ---------- lip-sync (amplitude -> jaw/morph) ----------
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 512;
analyser.connect(audioCtx.destination);
const timeData = new Uint8Array(analyser.fftSize);
let talking = false;

function attachSource(node) {
  node.connect(analyser);
  talking = true;
}

document.getElementById('audioFile').onchange = async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  await audioCtx.resume();
  const buf = await audioCtx.decodeAudioData(await file.arrayBuffer());
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  attachSource(src);
  src.onended = () => { talking = false; };
  src.start();
  statusEl.textContent = 'در حال پخش و لیپ‌سینک…';
};

document.getElementById('micBtn').onclick = async () => {
  await audioCtx.resume();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const src = audioCtx.createMediaStreamSource(stream);
  src.connect(analyser); // do not route mic to speakers
  talking = true;
  statusEl.textContent = 'لیپ‌سینک زنده با میکروفون فعال شد';
};

function mouthAmount() {
  if (!talking) return 0;
  analyser.getByteTimeDomainData(timeData);
  let sum = 0;
  for (const v of timeData) { const d = (v - 128) / 128; sum += d * d; }
  const rms = Math.sqrt(sum / timeData.length);
  return Math.min(1, rms * 9);
}

// ---------- render loop ----------
const clock = new THREE.Clock();
let smooth = 0;
function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  updatePuppet(dt);

  const amt = mouthAmount();
  // fast attack, slower release reads better as speech
  smooth += (amt - smooth) * (amt > smooth ? 0.6 : 0.18);
  meterEl.style.width = (smooth * 100) + '%';
  if (MORPH.mouth >= 0) {
    // only drive from audio while it plays, so rahino.face.mouth() stays usable
    if (talking || smooth > 0.003) setMorph(MORPH.mouth, Math.min(1, smooth * 1.6));
  } else if (mouthMorphs.length) {
    for (const { mesh, index } of mouthMorphs) mesh.morphTargetInfluences[index] = smooth;
  } else if (jawBone) {
    jawBone.rotation.x = smooth * 0.35;
  }
  updateBlink(dt);
  updateTalkGestures(dt, smooth);

  controls.update();
  renderer.render(sceneGraph, camera);
}
tick();
</script>
</body>
</html>
